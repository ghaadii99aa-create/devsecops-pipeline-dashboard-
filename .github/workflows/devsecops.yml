name: DevSecOps Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Lowest severity that fails the security gate"
        type: choice
        default: CRITICAL
        options: [CRITICAL, HIGH, MEDIUM, LOW, NONE]
  schedule:
    # Weekly re-scan so newly published CVEs are caught even without new commits
    - cron: "17 3 * * 1"

# Least privilege by default; jobs opt in to anything extra they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: secureship-demo-api
  FAIL_ON: ${{ inputs.fail_on || 'CRITICAL' }}
  # SARIF uploads need a write token, which fork pull requests never get
  CAN_UPLOAD_SARIF: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

# All third-party actions are pinned to full commit SHAs (supply-chain hardening).
jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  bandit-sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install "bandit[sarif]==1.9.4"

      - name: Run Bandit (JSON for the dashboard)
        run: bandit -r . -x ./tests,./.venv -f json -o bandit-report.json --exit-zero

      - name: Run Bandit (SARIF for GitHub code scanning)
        run: bandit -r . -x ./tests,./.venv -f sarif -o bandit.sarif --exit-zero

      - name: Upload SARIF to GitHub Security tab
        if: env.CAN_UPLOAD_SARIF == 'true'
        continue-on-error: true # code scanning is unavailable on private repos without GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: bandit.sarif
          category: bandit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: error

  trivy-fs:
    name: SCA, Secrets & IaC (Trivy fs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-fs-report.json
          exit-code: "0" # the security gate job decides pass/fail

      - name: Convert report to SARIF
        run: trivy convert --format sarif --output trivy-fs.sarif trivy-fs-report.json

      - name: Upload SARIF to GitHub Security tab
        if: env.CAN_UPLOAD_SARIF == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          if-no-files-found: error

  trivy-image:
    name: Container Scan (Trivy image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln,secret
          ignore-unfixed: true # only report what can actually be remediated
          format: json
          output: trivy-image-report.json
          exit-code: "0"

      - name: Convert report to SARIF
        run: trivy convert --format sarif --output trivy-image.sarif trivy-image-report.json

      - name: Upload SARIF to GitHub Security tab
        if: env.CAN_UPLOAD_SARIF == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: error

  security-gate:
    name: Security Gate & Dashboard
    runs-on: ubuntu-latest
    needs: [unit-tests, bandit-sast, trivy-fs, trivy-image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download scan reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-report"
          path: scan-reports
          merge-multiple: true

      - name: Evaluate findings
        id: gate
        run: |
          if python scripts/security_gate.py \
              --input-dir scan-reports \
              --output dashboard-dist/reports/scan-results.json \
              --fail-on "${FAIL_ON}"; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble dashboard bundle
        run: |
          cp index.html dashboard-dist/
          cp scan-reports/*.json dashboard-dist/reports/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-dashboard
          path: dashboard-dist/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard-dist/

      - name: Enforce security gate
        if: steps.gate.outputs.status != 'passed'
        run: |
          echo "::error::Security gate failed (policy: fail on ${FAIL_ON} or above). See the job summary or the dashboard artifact."
          exit 1

  deploy-dashboard:
    name: Publish Dashboard (GitHub Pages)
    runs-on: ubuntu-latest
    needs: security-gate
    # Publish even when the gate fails - the dashboard is how the team sees *why*.
    # Opt in by setting the repository variable ENABLE_PAGES=true (Settings > Pages > Source: GitHub Actions).
    if: >-
      always() &&
      needs.security-gate.result != 'cancelled' &&
      needs.security-gate.result != 'skipped' &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.ENABLE_PAGES == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
